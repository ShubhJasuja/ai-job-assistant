version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_assistant_db
    environment:
      POSTGRES_USER: jobadmin
      POSTGRES_PASSWORD: jobpassword
      POSTGRES_DB: jobassistant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobadmin -d jobassistant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job_assistant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: