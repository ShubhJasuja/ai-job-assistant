# Reverse-proxy the frontend SPA to the backend.
#
# API calls are forwarded to the Spring Boot container; everything else is
# served from the built SPA bundle, falling back to index.html so that
# client-side routing keeps working.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Proxy API requests to the backend service.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health + docs endpoints also reach the backend.
    location /actuator/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /swagger-ui.html {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Serve the SPA bundle, falling back to index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}