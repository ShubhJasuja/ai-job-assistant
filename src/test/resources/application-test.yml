spring:
  application:
    name: ai-job-assistant-test

  datasource:
    url: jdbc:postgresql://localhost:5432/jobassistant_test
    username: jobadmin
    password: jobpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 0

logging:
  level:
    com.jobassistant: INFO

# Use the test profile for Flyway as well
spring.flyway.enabled: true