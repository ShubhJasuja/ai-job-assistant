spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        id:
          new_generator_mappings: false
  flyway:
    enabled: false
job-sources:
  greenhouse-boards: []
  lever-sites: []
  rss-feeds: []
  schedule-enabled: false
  initial-delay-ms: 2147483647
  refresh-interval-ms: 2147483647
