<!DOCTYPE html>
<html>
<head><title>Fixture Form</title></head>
<body>
  <form>
    <label name="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" />
    <label name="emailAddress">Email</label>
    <input type="email" id="emailAddress" name="emailAddress" />
    <label name="coverLetter">Cover Letter</label>
    <textarea id="coverLetter" name="coverLetter"></textarea>
    <label name="experienceLevel">Experience Level</label>
    <select id="experienceLevel" name="experienceLevel">
      <option value="entry">Entry</option>
      <option value="mid">Mid</option>
      <option value="senior">Senior</option>
    </select>
  </form>
</body>
</html>
