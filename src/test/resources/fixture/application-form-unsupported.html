<!DOCTYPE html>
<html>
<head><title>Fixture Form - Unsupported Controls</title></head>
<body>
  <form>
    <label name="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" />
    <label name="portfolioUrl">Portfolio</label>
    <input type="url" id="portfolioUrl" name="portfolioUrl" />
    <label name="resumeUpload">Resume</label>
    <input type="file" id="resumeUpload" name="resumeUpload" />
    <label name="agreed">Consent</label>
    <input type="checkbox" id="agreed" name="agreed" />
    <label name="notes">Notes</label>
    <input type="hidden" id="notes" name="notes" value="token" />
  </form>
</body>
</html>
