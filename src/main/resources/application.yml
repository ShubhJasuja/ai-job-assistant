spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ai-job-assistant

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jobassistant_db}
    username: ${DB_USER:jobadmin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # NEVER use update/create in real projects
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Matching engine weights (configurable)
matching:
  weightSkills: 40
  weightExperience: 20
  weightLocation: 15
  weightEducation: 10
  weightRemote: 10
  weightRole: 5

# Public Greenhouse boards are a small verified starter set. Override with a
# comma-separated list of "board-slug=Company Name" values in GREENHOUSE_BOARDS.
# Lever/RSS connectors remain opt-in; RSS values use "https://feed-url|Company Name".
job-sources:
  greenhouse-boards: ${GREENHOUSE_BOARDS:stripe=Stripe,anthropic=Anthropic,datadog=Datadog,cloudflare=Cloudflare,mongodb=MongoDB}
  lever-sites: ${LEVER_SITES:}
  rss-feeds: ${RSS_FEEDS:}
  initial-delay-ms: ${JOB_SOURCE_INITIAL_DELAY_MS:60000}
  refresh-interval-ms: ${JOB_SOURCE_REFRESH_INTERVAL_MS:21600000}

# AI configuration (disabled by default)
# Set AI_ENABLED=true and AI_API_KEY via env to activate OpenAI.
# Provider class selected by @ConditionalOnProperty; NoOp is default.

# JWT configuration
jwt:
  secret: ${JWT_SECRET:change-me-at-least-32-characters-long}
  expiration: 900000
  refresh-token:
    expiration: 604800000
